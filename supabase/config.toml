[functions.submit-audit-lead]
# Öffentliches Lead-Formular: Der Aufruf trägt nur den Publishable-Key (kein JWT),
# daher kein Plattform-JWT-Gating. Die Function schützt sich selbst über
# Origin-Allowlist, Rate-Limit (register_audit_lead_attempt), Honeypot/Timing und
# strikte Eingabevalidierung.
verify_jwt = false

[functions.submit-funnel-lead]
# Qualifizierung + Events von /ai-roadmap.html. Gleicher Schutz wie Audit-Lead:
# Origin-Allowlist, Rate-Limit (register_funnel_attempt), Timing, Feldgrenzen.
verify_jwt = false
