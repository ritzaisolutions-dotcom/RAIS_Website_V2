<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RAIS Glass Assets</title>
  <style>
    body { margin: 0; padding: 2rem; background: #004225; color: #FBF8F3; font-family: system-ui, sans-serif; }
    h1 { font-weight: 500; font-size: 1.25rem; margin: 0 0 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.25rem; }
    .wide { grid-column: span 2; }
    figure { margin: 0; padding: 1rem; background: rgba(251,248,243,0.06); border: 1px solid rgba(251,248,243,0.14); border-radius: 12px; text-align: center; }
    img { width: 100%; max-width: 160px; height: auto; display: block; margin: 0 auto; }
    .wide img { max-width: 280px; }
    figcaption { margin-top: 0.75rem; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>images/glass</h1>
  <div class="grid">
    <figure><img src="play.svg" alt="play"><figcaption>play.svg · Briefing</figcaption></figure>
    <figure><img src="calendar.svg" alt="calendar"><figcaption>calendar.svg · Briefing</figcaption></figure>
    <figure><img src="open.svg" alt="open"><figcaption>open.svg · Briefing</figcaption></figure>
    <figure class="wide"><img src="inbox.svg" alt="inbox"><figcaption>inbox.svg · Schmerz</figcaption></figure>
    <figure class="wide"><img src="flow.svg" alt="flow"><figcaption>flow.svg · Ergebnis</figcaption></figure>
    <figure><img src="document.svg" alt="document"><figcaption>document.svg · Beweis</figcaption></figure>
    <figure><img src="shield.svg" alt="shield"><figcaption>shield.svg · Bestand</figcaption></figure>
    <figure><img src="bars.svg" alt="bars"><figcaption>bars.svg · Bestand</figcaption></figure>
    <figure><img src="chat.svg" alt="chat"><figcaption>chat.svg · Bestand</figcaption></figure>
  </div>
</body>
</html>
