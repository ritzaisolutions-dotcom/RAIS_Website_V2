<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="g-inbox-bg" x1="20" y1="10" x2="260" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A5231"/>
      <stop offset="100%" stop-color="#002A18"/>
    </linearGradient>
    <linearGradient id="g-mail" x1="40" y1="40" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C5DCC5"/>
      <stop offset="55%" stop-color="#5A9A6A"/>
      <stop offset="100%" stop-color="#004225"/>
    </linearGradient>
    <linearGradient id="g-mail-shine" x1="60" y1="36" x2="200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-inbox" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dy="4" result="o"/>
      <feFlood flood-color="#001a0f" flood-opacity="0.45"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="280" height="200" rx="20" fill="url(#g-inbox-bg)"/>
  <g filter="url(#f-inbox)">
    <rect x="48" y="36" width="184" height="48" rx="10" fill="url(#g-mail)" opacity="0.55" transform="translate(0 28) rotate(-4 140 60)"/>
    <rect x="44" y="48" width="192" height="52" rx="10" fill="url(#g-mail)" opacity="0.75" transform="translate(0 14) rotate(2 140 74)"/>
    <rect x="40" y="58" width="200" height="58" rx="12" fill="url(#g-mail)" opacity="0.96"/>
    <rect x="40" y="58" width="200" height="58" rx="12" fill="url(#g-mail-shine)"/>
    <path d="M52 70h120M52 86h88" stroke="#FBF8F3" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <rect x="196" y="72" width="28" height="14" rx="7" fill="#EC6A37"/>
  </g>
  <text x="140" y="168" text-anchor="middle" fill="#FBF8F3" fill-opacity="0.55" font-family="Instrument Sans, system-ui, sans-serif" font-size="11" letter-spacing="0.12em">ZU SPAET</text>
</svg>
